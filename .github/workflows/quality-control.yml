name: Quality Control

on:
  workflow_call:

jobs:
  qa:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code Linting
            group: linting
            install: pip install -r requirements_linting.txt
            command: flake8

          - name: Typing
            group: typing
            install: pip install -r requirements_typing.txt
            command: mypy

          - name: Testing
            group: testing
            install: |
              pip install -r requirements.txt
              pip install -r requirements_testing.txt
            command: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Run checks
        run: ${{ matrix.command }}
