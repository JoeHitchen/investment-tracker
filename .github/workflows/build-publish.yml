name: Build & Publish

concurrency:
  group: build-publish
  cancel-in-progress: false

on:
  push:
    branches:
      - deploy
      - github-actions-migration

jobs:
  building:
    name: Building
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t joehitchen/sipp-tracker .

      - name: Run tests to verify image
        run: docker run --rm joehitchen/sipp-tracker sh -c 'export PATH="$HOME/.local/bin:$PATH" && pip install -r requirements_testing.txt && pytest'

      - name: Save image
        run: docker save --output sipp-tracker.docker joehitchen/sipp-tracker

      - name: Store image artifact
        uses: actions/upload-artifact@v7
        with:
          name: sipp-tracker-docker
          path: sipp-tracker.docker

  publishing:
    name: Publishing
    needs: building
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retrieve image artifact
        uses: actions/download-artifact@v8
        with:
          name: sipp-tracker-docker
          path: .

      - name: Load image into Docker
        run: docker load --input sipp-tracker.docker

      - name: Push Docker image
        run: docker push joehitchen/sipp-tracker
