name: Load image
description: Download the investment-tracker-docker build artifact and load it into the local Docker daemon

runs:
  using: composite
  steps:
    - name: Retrieve image artifact
      uses: actions/download-artifact@v8
      with:
        name: investment-tracker-docker
        path: .

    - name: Load image into Docker
      shell: bash
      run: docker load --input investment-tracker.docker
