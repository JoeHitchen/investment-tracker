[flake8]

max-line-length = 99

exclude = 
    .git,
    venv**,
    __pycache__,
    *.pyc,
    migrations,
    manage.py,

ignore =
    E251,
    E303,
    W391,
    W503,

import-order-style = pep8app
application-package-names = 
    core,
    sipp,

multiline-quotes = '''


[mypy]
files = core,sipp,*.py
exclude = migrations
strict = true
mypy_path = typing
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = core.settings

[tool:pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test*.py

